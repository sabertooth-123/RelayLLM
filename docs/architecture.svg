<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>RelayLLM architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">RelayLLM: one durable coordinator, N independent workers</text>

  <!-- Clients -->
  <rect x="24" y="70" width="170" height="120" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="109" y="94" text-anchor="middle" font-weight="600" fill="#312e81">Clients</text>
  <text x="109" y="116" text-anchor="middle" fill="#374151">relay CLI · any HTTP client</text>
  <text x="109" y="136" text-anchor="middle" fill="#374151">submit · status · result</text>
  <text x="109" y="156" text-anchor="middle" fill="#374151">cancel · attempts</text>
  <text x="109" y="176" text-anchor="middle" fill="#6b7280" font-size="11">idempotency key on every submit</text>

  <!-- Coordinator -->
  <rect x="250" y="60" width="420" height="420" rx="12" fill="#f9fafb" stroke="#111827" stroke-width="1.5"/>
  <text x="460" y="84" text-anchor="middle" font-weight="600" font-size="15" fill="#111827">Coordinator process (relay coordinator)</text>

  <rect x="274" y="100" width="372" height="78" rx="8" fill="#ecfeff" stroke="#0891b2"/>
  <text x="460" y="121" text-anchor="middle" font-weight="600" fill="#155e75">Axum HTTP API</text>
  <text x="460" y="141" text-anchor="middle" fill="#374151">/v1/jobs · /v1/workers · claims · heartbeat · complete · fail</text>
  <text x="460" y="161" text-anchor="middle" fill="#6b7280" font-size="11">middleware: request timeout (504) · access log · /metrics · body limit</text>

  <rect x="274" y="194" width="176" height="96" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="362" y="216" text-anchor="middle" font-weight="600" fill="#166534">Store</text>
  <text x="362" y="236" text-anchor="middle" fill="#374151">every write = one</text>
  <text x="362" y="254" text-anchor="middle" fill="#374151">BEGIN IMMEDIATE txn</text>
  <text x="362" y="274" text-anchor="middle" fill="#6b7280" font-size="11">fenced on (attempt, state)</text>

  <rect x="470" y="194" width="176" height="96" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="558" y="216" text-anchor="middle" font-weight="600" fill="#9a3412">Lease reaper</text>
  <text x="558" y="236" text-anchor="middle" fill="#374151">every lease/4 + at startup</text>
  <text x="558" y="254" text-anchor="middle" fill="#374151">expired → retry (backoff)</text>
  <text x="558" y="274" text-anchor="middle" fill="#6b7280" font-size="11">grace on restart · clock-jump guard</text>

  <rect x="314" y="316" width="292" height="140" rx="8" fill="#ffffff" stroke="#374151"/>
  <text x="460" y="338" text-anchor="middle" font-weight="600" fill="#111827">SQLite (WAL) — the source of truth</text>
  <text x="460" y="360" text-anchor="middle" fill="#374151">jobs: state · attempt (fencing token)</text>
  <text x="460" y="380" text-anchor="middle" fill="#374151">lease_expires_at · attempt_deadline</text>
  <text x="460" y="400" text-anchor="middle" fill="#374151">job_attempts: history + claim_id</text>
  <text x="460" y="420" text-anchor="middle" fill="#374151">workers: registry + liveness</text>
  <text x="460" y="442" text-anchor="middle" fill="#6b7280" font-size="11">CHECK constraints + triggers enforce the state machine</text>

  <line x1="362" y1="290" x2="400" y2="316" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="558" y1="290" x2="520" y2="316" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="362" y1="178" x2="362" y2="194" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Workers -->
  <g>
    <rect x="726" y="70" width="210" height="104" rx="10" fill="#fefce8" stroke="#ca8a04"/>
    <text x="831" y="93" text-anchor="middle" font-weight="600" fill="#713f12">Worker 1 (relay worker)</text>
    <text x="831" y="114" text-anchor="middle" fill="#374151">claim loop · semaphore slots</text>
    <text x="831" y="134" text-anchor="middle" fill="#374151">heartbeat every lease/3</text>
    <text x="831" y="154" text-anchor="middle" fill="#374151">handlers: mock · chat</text>
  </g>
  <rect x="726" y="196" width="210" height="60" rx="10" fill="#fefce8" stroke="#ca8a04"/>
  <text x="831" y="231" text-anchor="middle" font-weight="600" fill="#713f12">Worker 2</text>
  <rect x="726" y="278" width="210" height="60" rx="10" fill="#fefce8" stroke="#ca8a04"/>
  <text x="831" y="313" text-anchor="middle" font-weight="600" fill="#713f12">Worker N</text>

  <rect x="726" y="390" width="210" height="70" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-dasharray="5 4"/>
  <text x="831" y="414" text-anchor="middle" font-weight="600" fill="#5b21b6">LLM endpoint (optional)</text>
  <text x="831" y="434" text-anchor="middle" fill="#374151">OpenAI-compatible, http</text>
  <text x="831" y="450" text-anchor="middle" fill="#6b7280" font-size="11">Ollama · llama.cpp · vLLM</text>
  <line x1="831" y1="338" x2="831" y2="390" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="838" y="368" fill="#5b21b6" font-size="11">chat jobs</text>

  <!-- Client <-> API -->
  <line x1="194" y1="130" x2="274" y2="139" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="200" y="120" fill="#374151" font-size="11">HTTP/JSON</text>

  <!-- Workers <-> API (pull) -->
  <line x1="726" y1="122" x2="646" y2="128" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="726" y1="226" x2="646" y2="150" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="726" y1="308" x2="646" y2="168" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="652" y="100" fill="#374151" font-size="11">workers pull</text>

  <!-- Failure annotations -->
  <rect x="24" y="230" width="200" height="226" rx="10" fill="#fef2f2" stroke="#b91c1c"/>
  <text x="124" y="253" text-anchor="middle" font-weight="600" fill="#991b1b">Failures handled</text>
  <text x="36" y="277" fill="#374151">• worker crash → lease expires,</text>
  <text x="48" y="295" fill="#374151">job retried (attempt + 1)</text>
  <text x="36" y="317" fill="#374151">• stale worker returns →</text>
  <text x="48" y="335" fill="#374151">409, fenced by attempt</text>
  <text x="36" y="357" fill="#374151">• lost response → retry with</text>
  <text x="48" y="375" fill="#374151">same idempotency/claim id</text>
  <text x="36" y="397" fill="#374151">• coordinator crash → WAL</text>
  <text x="48" y="415" fill="#374151">replay + lease grace</text>
  <text x="36" y="437" fill="#374151">• hung handler → deadline</text>

  <!-- Legend / guarantees -->
  <rect x="24" y="500" width="912" height="80" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="44" y="526" font-weight="600" fill="#111827">Guarantees</text>
  <text x="44" y="548" fill="#374151">at-least-once execution · at most one recorded result per job · durable acceptance (fsync per commit by default) · bounded queue (503)</text>
  <text x="44" y="568" fill="#6b7280" font-size="12">Not provided: exactly-once side effects · multiple coordinators (single point of failure for availability, not durability) · authentication</text>
</svg>
